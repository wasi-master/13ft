services:
  13ft-dev:
    container_name: 13ft-dev
    build:
      context: .
      args:
        UID: "1000"
        GID: "1000"
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEBUG=1
      - PYTHONUNBUFFERED=1
      - UVICORN_LOG_LEVEL=info
    volumes:
      - ./app:/app/app:ro
      - ./api:/app/api:ro
      - ./requirements.txt:/app/requirements.txt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
