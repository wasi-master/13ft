name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: thirteen-ft

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker info > /dev/null
          docker compose version
          docker compose -p "$APP_NAME" -f docker-compose.dev.yaml config --quiet

      - name: Build
        run: docker compose -p "$APP_NAME" -f docker-compose.dev.yaml build --pull

      - name: Check Python syntax
        run: docker compose -p "$APP_NAME" -f docker-compose.dev.yaml run --rm --no-deps 13ft python -m compileall -q /app

      - name: Deploy
        run: docker compose -p "$APP_NAME" -f docker-compose.dev.yaml up -d --no-build 13ft

      - name: Check application
        run: |
          for attempt in $(seq 1 30); do
            if docker compose -p "$APP_NAME" -f docker-compose.dev.yaml exec -T 13ft python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:5000/", timeout=5).close()'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p "$APP_NAME" -f docker-compose.dev.yaml logs --tail=100 13ft
          exit 1
